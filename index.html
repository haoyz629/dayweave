<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="今序 · Dayweave — Bring order to your day. 让今天，井然有序。" />
    <title>今序 · Dayweave</title>
    <link rel="icon" type="image/x-icon" href="/src/assets/logo-favicon.ico" />
    <style>
      body { margin: 0; font-family: Inter, 'Segoe UI', 'Microsoft YaHei UI', 'Microsoft YaHei', sans-serif; color: #172b4d; background: #f6f8fb; }
      .startup { box-sizing: border-box; display: flex; min-height: 100vh; min-height: 100dvh; flex-direction: column; align-items: center; justify-content: center; padding: 32px 20px; text-align: center; }
      .startup-logo { display: block; width: 64px; height: 64px; margin-bottom: 16px; }
      .startup h1 { margin: 0; font-size: 20px; font-weight: 600; line-height: 1.5; }
      .startup-copy { margin: 10px 0 0; color: #4a5c75; font-size: 13px; line-height: 1.8; }
      .startup-status { display: flex; align-items: center; gap: 8px; margin: 28px 0 0; color: #4a5c75; font-size: 12px; line-height: 20px; }
      .startup-spinner { box-sizing: border-box; width: 14px; height: 14px; border: 1.5px solid #bdc9d8; border-top-color: #4a5c75; border-radius: 50%; animation: startup-spin 1s linear infinite; }
      @keyframes startup-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .startup-spinner { animation: none; } }
    </style>
  </head>
  <body>
    <!--
      THESIS: 任务页是一张可操作的本地任务账本，拒绝把状态与编辑动作拆成同质卡片。
      OWN-WORLD: 米白工作台、石墨文字、单一靛蓝状态强调；细分隔线与紧凑行承担结构。
      STORY: 用户读取真实任务，选择一行，在同屏检查器中编辑、流转或进入回收站，并只在 SQLite 提交后得到反馈。
      FIRST VIEWPORT: 左侧状态账本、右侧常驻详情检查器；搜索和状态切换位于账本上方，保存动作贴近表单末端。
      FORM: incumbent-workbench extension · seed JX-TASK-CLOSURE-01.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <div id="root">
      <main class="startup" aria-labelledby="startup-title" aria-busy="true">
        <img class="startup-logo" src="/src/assets/logo-light.svg" alt="" width="64" height="64" />
        <h1 id="startup-title">今序 · Dayweave</h1>
        <p class="startup-copy"><span lang="en">Bring order to your day.</span><br />让今天，井然有序。</p>
        <p class="startup-status" role="status"><span class="startup-spinner" aria-hidden="true"></span>正在打开今序…</p>
        <noscript><p class="startup-copy">无法加载界面，请启用 JavaScript 后重新打开应用。</p></noscript>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
