<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 220" width="100%" height="100%">
  <!-- 跨平台现代无衬线字体样式定义 -->
  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Segoe UI", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      font-size: 54px;
      font-weight: 700;
      fill: #1E293B;
      letter-spacing: -0.5px;
    }
    .dot {
      fill: #334155;
      font-weight: 500;
    }
    .slogan-cn {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Segoe UI", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      font-size: 38px;
      font-weight: 500;
      fill: #475569;
      letter-spacing: 2.2px;
    }
    .slogan-en {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      font-size: 27px;
      font-weight: 400;
      fill: #64748B;
      letter-spacing: 0.2px;
    }
  </style>

  <!-- 第一层：品牌主标题 -->
  <text x="0" y="58" class="title">今序<tspan class="dot"> · </tspan>Dayweave</text>

  <!-- 第二层：中文 Slogan -->
  <text x="0" y="132" class="slogan-cn">让今天，井然有序。</text>

  <!-- 第三层：英文副标 -->
  <text x="0" y="196" class="slogan-en">Bring order to your day.</text>
</svg>